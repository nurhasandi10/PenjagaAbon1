name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build
        run: |
          if [ -f PenjagaAbon.zip ]; then unzip -o PenjagaAbon.zip; fi
          D=$(dirname "$(find . -name gradlew | head -1)")
          cd "$D"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/"
      - uses: actions/upload-artifact@v4
        with:
          name: PenjagaAbon-apk
          path: app-debug.apk
